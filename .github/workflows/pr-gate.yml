name: pr-gate
"on":
  pull_request:
    branches:
      - main
jobs:
  # Fan-in gate. This is the single status check required by the
  # main-branch ruleset (`required_status_checks` -> `pr-gate`).
  # It depends on every other job in this workflow and explicitly
  # fails if any upstream job did not succeed, so a failing `go-tests`
  # or `nix-build-prism-checked` job blocks the PR via the required
  # check. `if: always()` ensures the gate runs even when an upstream
  # job fails (default `needs:` semantics would skip it instead, which
  # the ruleset would interpret as neutral / not-failed).
  #
  # On non-Go PRs both upstream jobs short-circuit to a success echo,
  # so this gate still passes cheaply.
  gate:
    name: pr-gate
    runs-on: ubuntu-latest
    needs:
      - go-tests
      - nix-build-prism-checked
      - go-tests-battery-monitor
      - nix-build-battery-monitor-checked
      - pi-extension-tests
      - go-tests-macos-sandbox-exec
    if: always()
    steps:
      - name: Check upstream job results
        env:
          GO_TESTS_RESULT: ${{ needs.go-tests.result }}
          NIX_BUILD_PRISM_CHECKED_RESULT: ${{ needs.nix-build-prism-checked.result }}
          GO_TESTS_BM_RESULT: ${{ needs.go-tests-battery-monitor.result }}
          NIX_BUILD_BM_CHECKED_RESULT: ${{ needs.nix-build-battery-monitor-checked.result }}
          PI_EXTENSION_TESTS_RESULT: ${{ needs.pi-extension-tests.result }}
          GO_TESTS_MACOS_SANDBOX_EXEC_RESULT: ${{ needs.go-tests-macos-sandbox-exec.result }}
        run: |
          echo "go-tests: $GO_TESTS_RESULT"
          echo "nix-build-prism-checked: $NIX_BUILD_PRISM_CHECKED_RESULT"
          echo "go-tests-battery-monitor: $GO_TESTS_BM_RESULT"
          echo "nix-build-battery-monitor-checked: $NIX_BUILD_BM_CHECKED_RESULT"
          echo "pi-extension-tests: $PI_EXTENSION_TESTS_RESULT"
          echo "go-tests-macos-sandbox-exec: $GO_TESTS_MACOS_SANDBOX_EXEC_RESULT"
          if [ "$GO_TESTS_RESULT" != "success" ] \
             || [ "$NIX_BUILD_PRISM_CHECKED_RESULT" != "success" ] \
             || [ "$GO_TESTS_BM_RESULT" != "success" ] \
             || [ "$NIX_BUILD_BM_CHECKED_RESULT" != "success" ] \
             || [ "$PI_EXTENSION_TESTS_RESULT" != "success" ] \
             || [ "$GO_TESTS_MACOS_SANDBOX_EXEC_RESULT" != "success" ]; then
            echo "pr-gate: one or more required jobs did not succeed" >&2
            exit 1
          fi
          echo "pr-gate ok"

  # Full Go test suite with -race. Runs on PRs that touch Go-relevant
  # paths only. See issue #1494.
  go-tests:
    name: go-tests
    runs-on: ubuntu-latest
    # Path filtering is applied via dorny/paths-filter so the rest of
    # the gate (the cheap stub) still runs on non-Go PRs. On non-Go
    # PRs the job reports success after a single echo step.
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - 'modules/programs/prism/prism/**'
              - 'pkgs/prism.nix'
              - '**/go.mod'
              - '**/go.sum'
              - '.github/workflows/pr-gate.yml'
      - name: Set up Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: modules/programs/prism/prism/go.mod
          cache-dependency-path: modules/programs/prism/prism/go.sum
      - name: Install bwrap
        if: steps.changes.outputs.go == 'true'
        run: |
          DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -q -y
          sudo apt-get install -q -y bubblewrap
      # Enforce gofmt across the prism Go module before anything else
      # runs, so a formatting drift surfaces at the top of the CI summary
      # rather than hiding inside an otherwise-green `go test ./...`.
      # Scoped to `modules/programs/prism/prism/` via working-directory
      # so it never lints unrelated Go modules elsewhere in the repo
      # (e.g. battery-monitor has its own go.mod). See issue #2218.
      - name: gofmt check
        if: steps.changes.outputs.go == 'true'
        working-directory: modules/programs/prism/prism
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt — run \`gofmt -w .\` from modules/programs/prism/prism/ and commit:"
            echo "$unformatted"
            exit 1
          fi
      - name: go build
        if: steps.changes.outputs.go == 'true'
        working-directory: modules/programs/prism/prism
        run: go build ./...
      - name: go test ./... -race
        if: steps.changes.outputs.go == 'true'
        working-directory: modules/programs/prism/prism
        # Capture verbose output to a log file so the next step can extract
        # the skipped-test list without re-running the whole suite. Tee
        # stdout so the live log on Actions still shows progress.
        run: |
          set -o pipefail
          go test -v ./... -race 2>&1 | tee /tmp/go-test-v.log
      # Surface the skipped-tests list in the Actions job summary so the gap
      # is visible on every PR run rather than buried in -v output. See
      # AGENTS.md and issue #1510 for why these skips exist; if the list
      # ever grows, reviewers should notice. The grep is best-effort — if
      # it produces nothing we emit "(none)" so the section is never empty.
      - name: Summarise skipped tests
        # always() ensures this step runs even if the test step failed, so
        # the skip summary is emitted on red builds too.
        if: always() && steps.changes.outputs.go == 'true'
        working-directory: modules/programs/prism/prism
        run: |
          {
            echo "## Skipped tests"
            echo
            echo 'Tests skipped on GitHub Actions runner. See #1510 for the tracking issue.'
            echo
            echo '```'
            if [ -f /tmp/go-test-v.log ]; then
              grep -E '^(=== SKIP|    [^ ].*_test\.go:[0-9]+: skipping)' /tmp/go-test-v.log || echo "(none)"
            else
              echo "(go test log not found — likely the test step did not run)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: No Go-relevant changes
        if: steps.changes.outputs.go != 'true'
        run: echo "no Go-relevant paths touched; skipping go-tests"

  # Runs the Darwin-only sandbox-exec integration tests on a bare macOS VM.
  #
  # These tests live under internal/integration/sandbox_exec_*_darwin_test.go
  # (build-tagged darwin) and never execute on the ubuntu go-tests job
  # above: the darwin files do not compile on Linux, and inside a prism
  # worker sandbox they SKIP because a nested sandbox-exec profile cannot be
  # applied. A GitHub-hosted macos-15 runner is a bare macOS VM, not a
  # nested prism sandbox, so a top-level sandbox-exec profile applies and
  # the tests actually execute. See issue #2749.
  #
  # No-duplication mechanism: every test function in those files is named
  # TestSandboxExec*, and no cross-platform (untagged) test in
  # internal/integration/ uses that prefix, so -run '^TestSandboxExec'
  # selects only the darwin sandbox-exec tests here. Each test therefore
  # runs exactly once across the whole pipeline (ubuntu compiles but does
  # not run them; macos runs but does not run anything else).
  #
  # This job does NOT change worker isolation: it is CI-only test
  # execution, not a change to config.ValidIsolationModes or any worker
  # spawn default.
  go-tests-macos-sandbox-exec:
    name: go-tests-macos-sandbox-exec
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Detect Go-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - 'modules/programs/prism/prism/**'
              - 'pkgs/prism.nix'
              - '**/go.mod'
              - '**/go.sum'
              - '.github/workflows/pr-gate.yml'
      - name: Set up Go
        if: steps.changes.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: modules/programs/prism/prism/go.mod
          cache-dependency-path: modules/programs/prism/prism/go.sum
      - name: go test ./internal/integration -run TestSandboxExec -race
        if: steps.changes.outputs.go == 'true'
        working-directory: modules/programs/prism/prism
        # Capture verbose output so the guard step below can confirm no
        # selected test reported SKIP and at least one test ran. tee keeps
        # live progress visible in the Actions log.
        run: |
          set -o pipefail
          go test -v ./internal/integration/ -run '^TestSandboxExec' -race 2>&1 | tee /tmp/go-test-macos-sandbox-exec.log
      # A SKIP must never read as a PASS (this was a review blocker on the
      # parent issue). go test exits 0 even when every selected test
      # skips (e.g. the /var/folders TMPDIR guard tripping on a runner
      # image change), so a green exit code alone is not sufficient
      # evidence that the sandbox-exec tests actually ran. This step fails
      # the job if any selected TestSandboxExec* test reports SKIP, or if
      # zero TestSandboxExec* tests ran at all (guards the -run selector
      # matching nothing, e.g. future naming drift away from the
      # TestSandboxExec* prefix). Modelled on the ubuntu go-tests job's
      # "Summarise skipped tests" step.
      - name: Guard against SKIP-as-PASS and a zero-test run
        if: always() && steps.changes.outputs.go == 'true'
        working-directory: modules/programs/prism/prism
        run: |
          if [ ! -f /tmp/go-test-macos-sandbox-exec.log ]; then
            echo "::error::go test log not found - likely the test step did not run" >&2
            exit 1
          fi

          run_count=$(grep -cE '^=== RUN   TestSandboxExec' /tmp/go-test-macos-sandbox-exec.log || true)
          skip_lines=$(grep -E '^(--- SKIP: TestSandboxExec|    [^ ].*_test\.go:[0-9]+: skipping)' /tmp/go-test-macos-sandbox-exec.log || true)

          echo "TestSandboxExec* tests run: ${run_count:-0}"
          if [ -n "$skip_lines" ]; then
            echo "::error::one or more TestSandboxExec* tests reported SKIP - a skip must not read as a pass:"
            echo "$skip_lines"
            exit 1
          fi
          if [ -z "$run_count" ] || [ "$run_count" -eq 0 ]; then
            echo "::error::0 TestSandboxExec* tests ran - the -run selector matched nothing, check for naming drift" >&2
            exit 1
          fi
          echo "go-tests-macos-sandbox-exec: ${run_count} TestSandboxExec* test(s) ran, none skipped"
      - name: No Go-relevant changes
        if: steps.changes.outputs.go != 'true'
        run: echo "no Go-relevant paths touched; skipping go-tests-macos-sandbox-exec"

  # Builds prism with doCheck=true so the homeless-shelter sandbox
  # signal ($HOME=/homeless-shelter) is preserved in the PR pipeline.
  # This is the single nix-build path that runs Go tests; all other
  # nix builds (build-and-cache, validate-flakes, local nh switch)
  # build prism with doCheck=false. See issue #1494.
  nix-build-prism-checked:
    name: nix-build-prism-checked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect prism-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            prism:
              - 'modules/programs/prism/prism/**'
              - 'pkgs/prism.nix'
              - '**/go.mod'
              - '**/go.sum'
              - '.github/workflows/pr-gate.yml'
      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.prism == 'true'
        with:
          extra_nix_config: |-
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        if: steps.changes.outputs.prism == 'true'
        with:
          authToken: ${{ secrets.CACHIX_TOKEN }}
          extraPullNames: nix-community
          name: lucidph3nx-nixos-config
      # Build prism with runChecks=true via .override on the flake's
      # `prism` package. This runs the Go test suite inside the nix
      # sandbox ($HOME=/homeless-shelter) without exposing a separate
      # `prism-checked` flake output (which would slow down
      # `nix flake check --all-systems` on every PR, including non-Go
      # PRs). See issue #1494.
      - name: nix build prism with runChecks=true
        if: steps.changes.outputs.prism == 'true'
        run: |
          nix build --print-build-logs --impure --no-link \
            --expr '(builtins.getFlake (toString ./.)).packages.x86_64-linux.prism.override { runChecks = true; }'
      - name: No prism-relevant changes
        if: steps.changes.outputs.prism != 'true'
        run: echo "no prism-relevant paths touched; skipping nix-build-prism-checked"

  # Runs the pi extension TypeScript test suite (tsx --test *.test.ts,
  # recursively under modules/programs/prism/pi/extensions/) plus the
  # anthropic-oauth extension-load smoke test
  # (verify-extension-loads.mjs). See issue #2561: before this job
  # existed, no CI job ran any *.test.ts file under the extensions
  # directory, so an extension-only PR reported a green `pr-gate`
  # having executed zero tests.
  #
  # `tsx` and `pi-coding-agent` come from the repo's own devShell
  # (flake.nix `devShells.default`), which applies the repo overlay so
  # `pi-coding-agent` resolves to the pinned version in
  # overlays/default.nix rather than whatever plain nixpkgs carries.
  pi-extension-tests:
    name: pi-extension-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect pi-extension-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ext:
              - 'modules/programs/prism/pi/extensions/**'
              - '.github/workflows/pr-gate.yml'
      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.ext == 'true'
        with:
          extra_nix_config: |-
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        if: steps.changes.outputs.ext == 'true'
        with:
          authToken: ${{ secrets.CACHIX_TOKEN }}
          extraPullNames: nix-community
          name: lucidph3nx-nixos-config
      # Run the TypeScript test suite. Node's built-in test runner (which
      # `tsx --test` wraps) prints a "ℹ tests <N>" summary line to
      # stdout, which we capture and re-assert on below so a silently
      # empty test run (e.g. the glob matching nothing) fails the job
      # loudly instead of reporting green. See issue #2561's last AC —
      # this is the exact defect class the job exists to catch.
      - name: tsx --test (pi extension TypeScript tests)
        if: steps.changes.outputs.ext == 'true'
        working-directory: modules/programs/prism/pi/extensions
        run: |
          set -o pipefail
          mapfile -d '' test_files < <(find . -name '*.test.ts' -print0)
          nix develop --print-build-logs .#default --command \
            tsx --test "${test_files[@]}" 2>&1 | tee /tmp/tsx-test.log

          test_count=$(grep -oE '^ℹ tests [0-9]+' /tmp/tsx-test.log | grep -oE '[0-9]+' || true)
          echo "tests executed: ${test_count:-0}"
          if [ -z "$test_count" ] || [ "$test_count" -eq 0 ]; then
            echo "::error::pi-extension-tests: 0 tests executed — this is treated as a failure (see issue #2561)" >&2
            exit 1
          fi
      - name: verify-extension-loads.mjs (anthropic-oauth smoke test)
        if: steps.changes.outputs.ext == 'true'
        run: |
          nix develop --print-build-logs .#default --command \
            node modules/programs/prism/pi/extensions/anthropic-oauth/verify-extension-loads.mjs
      - name: No pi-extension-relevant changes
        if: steps.changes.outputs.ext != 'true'
        run: echo "no pi-extension-relevant paths touched; skipping pi-extension-tests"

  # Full Go test suite for battery-monitor with -race. Mirrors the
  # `go-tests` job above. Path-filtered so non-battery-monitor PRs
  # short-circuit to a single echo step.
  go-tests-battery-monitor:
    name: go-tests-battery-monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect battery-monitor-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            bm:
              - 'modules/services/battery-monitor/**'
              - 'pkgs/battery-monitor.nix'
              - 'modules/services/battery-monitor.nix'
              - '**/go.mod'
              - '**/go.sum'
              - '.github/workflows/pr-gate.yml'
      - name: Set up Go
        if: steps.changes.outputs.bm == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: modules/services/battery-monitor/battery-monitor/go.mod
          cache-dependency-path: modules/services/battery-monitor/battery-monitor/go.sum
      - name: go build
        if: steps.changes.outputs.bm == 'true'
        working-directory: modules/services/battery-monitor/battery-monitor
        run: go build ./...
      - name: go test ./... -race
        if: steps.changes.outputs.bm == 'true'
        working-directory: modules/services/battery-monitor/battery-monitor
        run: go test -v ./... -race
      - name: No battery-monitor-relevant changes
        if: steps.changes.outputs.bm != 'true'
        run: echo "no battery-monitor-relevant paths touched; skipping go-tests-battery-monitor"

  # Builds battery-monitor with doCheck=true so the homeless-shelter
  # sandbox signal ($HOME=/homeless-shelter) is preserved in the PR
  # pipeline. Mirrors nix-build-prism-checked above.
  nix-build-battery-monitor-checked:
    name: nix-build-battery-monitor-checked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect battery-monitor-relevant changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            bm:
              - 'modules/services/battery-monitor/**'
              - 'pkgs/battery-monitor.nix'
              - 'modules/services/battery-monitor.nix'
              - '**/go.mod'
              - '**/go.sum'
              - '.github/workflows/pr-gate.yml'
      - uses: cachix/install-nix-action@v31
        if: steps.changes.outputs.bm == 'true'
        with:
          extra_nix_config: |-
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        if: steps.changes.outputs.bm == 'true'
        with:
          authToken: ${{ secrets.CACHIX_TOKEN }}
          extraPullNames: nix-community
          name: lucidph3nx-nixos-config
      - name: nix build battery-monitor with runChecks=true
        if: steps.changes.outputs.bm == 'true'
        run: |
          nix build --print-build-logs --impure --no-link \
            --expr '(builtins.getFlake (toString ./.)).packages.x86_64-linux.battery-monitor.override { runChecks = true; }'
      - name: No battery-monitor-relevant changes
        if: steps.changes.outputs.bm != 'true'
        run: echo "no battery-monitor-relevant paths touched; skipping nix-build-battery-monitor-checked"
