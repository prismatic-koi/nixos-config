name: update-flakes
"on":
  schedule:
    - cron: 20 4 * * 0,2,4,6
  workflow_dispatch: null

jobs:
  update-flakes:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |-
            accept-flake-config = true
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Update flake.lock
        id: update
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          if nix flake update --commit-lock-file; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload updated flake
        if: steps.update.outputs.updated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updated-flake
          path: |
            flake.lock
            .git/

  build-configs:
    needs: update-flakes
    if: needs.update-flakes.outputs.updated == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [navi, tui]
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false
          tool-cache: true
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |-
            accept-flake-config = true
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_TOKEN }}
          extraPullNames: nix-community
          name: lucidph3nx-nixos-config
      - name: Build NixOS config for ${{ matrix.config }} (before update)
        run: nix build --out-link result-before '.#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel'
      - name: Download updated flake
        uses: actions/download-artifact@v8
        with:
          name: updated-flake
      - name: Build NixOS config for ${{ matrix.config }} (after update)
        run: nix build --out-link result-after '.#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel'
      - name: Diff closures
        run: NO_COLOR=1 nix store diff-closures ./result-before ./result-after > diff-${{ matrix.config }}.txt 2>&1 || true
      - name: Upload diff
        uses: actions/upload-artifact@v7
        with:
          name: diff-${{ matrix.config }}
          path: diff-${{ matrix.config }}.txt

  create-pr:
    needs: [update-flakes, build-configs]
    if: needs.update-flakes.outputs.updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download updated flake
        uses: actions/download-artifact@v8
        with:
          name: updated-flake
      - name: Download diff for navi
        uses: actions/download-artifact@v8
        with:
          name: diff-navi
      - name: Download diff for tui
        uses: actions/download-artifact@v8
        with:
          name: diff-tui
      - name: Build PR body
        id: pr-body
        run: |
          delim="$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            echo '## Run report'
            echo ''
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '## Closure diff: navi'
            echo ''
            echo '```'
            cat diff-navi.txt
            echo '```'
            echo ''
            echo '## Closure diff: tui'
            echo ''
            echo '```'
            cat diff-tui.txt
            echo '```'
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          body: ${{ steps.pr-body.outputs.body }}
          branch: flake-updates
          delete-branch: true
          title: Update flake.lock
