name: update-flakes
"on":
  schedule:
    - cron: 20 4 * * 0,2,4,6
  workflow_dispatch: null

jobs:
  update-flakes:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |-
            accept-flake-config = true
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Update flake.lock
        id: update
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          if nix flake update --commit-lock-file; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload updated flake
        if: steps.update.outputs.updated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updated-flake
          path: |
            flake.lock
            .git/

  build-configs:
    needs: update-flakes
    if: needs.update-flakes.outputs.updated == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: navi
            os: ubuntu-latest
            target: nixosConfigurations.navi
          - name: tui
            os: ubuntu-latest
            target: nixosConfigurations.tui
          - name: m4mac
            os: macos-15
            target: darwinConfigurations.m4mac
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        if: runner.os == 'Linux'
        with:
          swap-storage: false
          tool-cache: true
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |-
            accept-flake-config = true
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_TOKEN }}
          extraPullNames: nix-community
          name: lucidph3nx-nixos-config
      - name: Build config for ${{ matrix.name }} (before update)
        run: nix build --out-link result-before '.#${{ matrix.target }}.config.system.build.toplevel'
      - name: Download updated flake
        uses: actions/download-artifact@v8
        with:
          name: updated-flake
      - name: Build config for ${{ matrix.name }} (after update)
        run: nix build --out-link result-after '.#${{ matrix.target }}.config.system.build.toplevel'
      - name: Diff closures
        run: nix store diff-closures ./result-before ./result-after 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > diff-${{ matrix.name }}.txt || true
      - name: Upload diff
        uses: actions/upload-artifact@v7
        with:
          name: diff-${{ matrix.name }}
          path: diff-${{ matrix.name }}.txt

  create-pr:
    needs: [update-flakes, build-configs]
    if: needs.update-flakes.outputs.updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download updated flake
        uses: actions/download-artifact@v8
        with:
          name: updated-flake
      - name: Download diffs
        uses: actions/download-artifact@v8
        with:
          pattern: diff-*
          merge-multiple: true
      - name: Build PR body
        id: pr-body
        run: |
          delim="$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            echo '## Run report'
            echo ''
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            for f in diff-*.txt; do
              host="${f#diff-}"
              host="${host%.txt}"
              echo "## Closure diff: ${host}"
              echo ''
              echo '```'
              cat "$f"
              echo '```'
              echo ''
            done
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          add-paths: flake.lock
          body: ${{ steps.pr-body.outputs.body }}
          branch: flake-updates
          delete-branch: true
          title: Update flake.lock
