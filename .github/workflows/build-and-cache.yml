name: build-and-cache
"on":
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: nixosConfigurations.navi
            name: navi
          - os: ubuntu-latest
            target: nixosConfigurations.tui
            name: tui
          - os: macos-15
            target: darwinConfigurations.m4mac
            name: m4mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        if: runner.os == 'Linux'
        with:
          swap-storage: false
          tool-cache: true
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |-
            accept-flake-config = true
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_TOKEN }}
          extraPullNames: nix-community
          name: lucidph3nx-nixos-config
      - name: Build config for ${{ matrix.name }}
        run: nix build --print-build-logs '.#${{ matrix.target }}.config.system.build.toplevel'
